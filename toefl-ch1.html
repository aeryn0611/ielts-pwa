    <button class="btn chrome" id="zhBtn" aria-pressed="${showZh}">${showZh?'隐藏译文':'显示译文'}</button>
    <button class="btn chrome" id="resetBtn">重置勾选</button>
    <span class="count chrome" id="cnt"></span></div><article>`;
  p.body.forEach((para,i)=>{
    html+=`<p>${markup(para)}</p><div class="zh chrome" ${showZh?'':'hidden'}>${p.zh[i]}</div>`;
  });
  html+=`</article>`;

  html+=`<details class="list"><summary>本篇目标词 ${words.length} 个（点开对照自测）</summary><div class="grid">`;
  words.forEach(w=>{const v=V[w];html+=`<span><b>${w}</b> ${v?v[2]:''}</span>`});
  html+=`</div></details>`;

  html+=`<section class="qs"><h3 class="chrome">阅读题 · ${p.qs.length} 道</h3>`;
  p.qs.forEach((q,qi)=>{
    html+=`<div class="q"><p class="stem">${qi+1}. ${q.stem}</p>`;
    q.opts.forEach((o,oi)=>{
      html+=`<button class="opt" data-q="${qi}" data-o="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`;
    });
    html+=`<div class="exp chrome" id="exp-${qi}" hidden>${q.exp}</div></div>`;
  });
  html+=`</section>`;
  mainEl.innerHTML=html;

  document.getElementById('zhBtn').onclick=()=>{showZh=!showZh;render()};
  document.getElementById('resetBtn').onclick=()=>{seen[cur]=new Set();render()};
  updateCount(words.length);

  mainEl.querySelectorAll('.w').forEach(b=>{
    if(seen[cur].has(b.dataset.k))b.classList.add('seen');
    b.onclick=()=>showNote(b,words.length);
  });
  mainEl.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const qi=+b.dataset.q,oi=+b.dataset.o,q=P[cur].qs[qi];
      mainEl.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x=>{
        x.disabled=true;
        if(+x.dataset.o===q.a)x.classList.add('right');
      });
      if(oi!==q.a)b.classList.add('wrong');
      document.getElementById('exp-'+qi).hidden=false;
    };
  });
}

function updateCount(total){
  const c=document.getElementById('cnt');
  if(c)c.textContent=`已查看 ${seen[cur].size} / ${total} 词`;
}

function showNote(btn,total){
  if(openBtn&&openBtn!==btn)openBtn.setAttribute('aria-expanded','false');
  btn.setAttribute('aria-expanded','true');openBtn=btn;
  const k=btn.dataset.k,v=V[k];
  seen[cur].add(k);btn.classList.add('seen');updateCount(total);
  if(!v){noteEl.innerHTML='<p class="empty">未找到该词条。</p>';return}
  const colls=(C[k]||[]).map(x=>`<li>${x}</li>`).join('');
  noteEl.innerHTML=`
    <p class="hw">${k}</p>
    <p class="ipa">${v[0]}</p>
    <span class="pos">${v[1]}</span>
    <p class="def">${v[2]}</p>
    <p class="lab">文中形式</p>
    <p class="ex">${btn.textContent}</p>
    ${colls?`<p class="lab">高频搭配</p><ul class="colls">${colls}</ul>`:''}`;
  asideEl.classList.add('open');
}
document.getElementById('closeNote').onclick=()=>{
  asideEl.classList.remove('open');
  if(openBtn){openBtn.setAttribute('aria-expanded','false');openBtn=null}
};
render();
</script>
</body>
</html>
