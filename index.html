<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="雅思同义">
  <meta name="theme-color" content="#0D1B2A">
  <title>IELTS Synonyms</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Screen 1: Search -->
  <div id="screen-search" class="screen active">
    <header class="screen-header">
      <h1 class="app-title">雅思同义词</h1>
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          id="search-input"
          type="search"
          placeholder="搜索词汇…"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
        >
      </div>
    </header>
    <main id="search-results" class="screen-body"></main>
  </div>

  <!-- Screen 2: Word Detail -->
  <div id="screen-detail" class="screen">
    <header class="screen-header">
      <button id="back-btn" class="back-btn">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        返回
      </button>
    </header>
    <main id="detail-content" class="screen-body"></main>
  </div>

  <!-- Screen 3: Review -->
  <div id="screen-review" class="screen">
    <header class="screen-header" id="review-header">
      <h2 class="review-title">复习</h2>
    </header>
    <main id="review-content" class="screen-body"></main>
  </div>

  <!-- Screen 4: Stats -->
  <div id="screen-stats" class="screen">
    <header class="screen-header">
      <h1 class="app-title">学习统计</h1>
    </header>
    <main id="stats-content" class="screen-body"></main>
  </div>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-screen="search">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span>查词</span>
    </button>
    <button class="nav-btn" data-screen="review">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>复习</span>
    </button>
    <button class="nav-btn" data-screen="stats">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
        <line x1="2" y1="20" x2="22" y2="20"/>
      </svg>
      <span>统计</span>
    </button>
  </nav>

</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
